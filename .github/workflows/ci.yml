name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache: true

      - name: Build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2.1.6 is built with Go 1.24 and refuses to lint a module that
          # targets go 1.25.0 (go.mod). Pin a build made with Go >= 1.25.
          version: v2.11.4
          args: --timeout=5m

      - name: Validate partial RFC checklist
        run: go run ./internal/checklist internal/rfctest

      # The RFC proofs in internal/rfctest drive the library from outside the
      # package, so coverage is counted across every package (-coverpkg). CI
      # fails below 95%; COVERAGE.md lists what is left uncovered and why.
      - name: Run tests with race detector and coverage
        run: go test -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Require at least 95% statement coverage
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          echo "Statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t + 0 >= 95) }'

  fuzz:
    name: Fuzz (5s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache: true

      # go test -fuzz takes one target at a time. Each runs for a fixed short
      # budget on two workers; a failing input is written under testdata/fuzz.
      - name: Fuzz each target
        run: |
          set -euo pipefail
          targets=$(go test -list '^Fuzz' . | grep '^Fuzz')
          test -n "$targets"
          for target in $targets; do
            echo "::group::$target"
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=5s -parallel=2 .
            echo "::endgroup::"
          done

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: testdata/fuzz
          if-no-files-found: ignore
